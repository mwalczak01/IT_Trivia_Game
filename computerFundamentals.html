<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techy Savvy Trivia - Computer FUN-damentals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="background-video">
        <video src="/assets/circuit_-_27725 (1080p).mp4" autoplay muted loop></video>
    </div>
    <div id="hud">
        <div class="hud-item">
            <p id="progressText" class="hud-prefix">
                Question
            </p>
        </div>
        <div class="hud-item">
            <span class="hud-prefix star-score">
                <img id="star" src="/assets/points.png" alt="star points">
                <h1 class="hud-prefix" id="score">0</h1>
            </span>
        </div>
    </div>
        <div class="container">
        <div id="game" class="justify-center flex-column">
            <h1 id="question">Question</h1>
            <div class="choice-container">
                <p class="choice-text" data-number="1">Choice 1</p>
            </div>
            <div class="choice-container">
                <p class="choice-text" data-number="2">Choice 2</p>
            </div>
            <div class="choice-container">
                <p class="choice-text" data-number="3">Choice 3</p>
            </div>
            <div class="choice-container">
                <p class="choice-text" data-number="4">Choice 4</p>
            </div>
        </div>
    </div>
    <script src="computerFundamentals.js"></script>
</body>
</html>
